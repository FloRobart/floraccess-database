# Development only: the official postgres image, and dbmate with the local db/ folder mounted.
# The API in development (docker-compose.dev.yml of floraccess-api) joins the floraccess-net network.

services:
  # Same name as in production, so that the API uses DB_HOST=floraccess-database in both cases
  floraccess-database:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql
    # Only on the loopback interface: reachable by the tools of this machine (psql, DBeaver...), not by the network
    ports:
      - 127.0.0.1:${DB_PORT:-5432}:5432
    networks:
      - floraccess-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} || exit 1"]
      interval: 5s
      timeout: 30s
      retries: 5

  # Default command: applies the pending migrations and regenerates db/schema.sql
  floraccess-migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD:-postgres}@floraccess-database:5432/${DB_NAME}?sslmode=disable
    command: ["--wait", "up"]
    volumes:
      - ./db:/db
    depends_on:
      floraccess-database:
        condition: service_healthy
    networks:
      - floraccess-net
    # The files written in db/ belong to the user of this machine, not to root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

volumes:
  db_data:
    name: ${DB_VOLUME_NAME:-floraccess_db_data_dev}

networks:
  floraccess-net:
    name: floraccess-net
    driver: bridge
